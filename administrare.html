<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard PFA – Administrare</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-hashes' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; base-uri 'self'; form-action 'self';">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
  <!-- Ecran de login (inițial ascuns, afișat de JS dacă nu e sesiune) -->
  <div id="login-screen" class="login-screen" style="display:none;">
    <div class="login-box">
      <h2>Autentificare PFA</h2>
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="login-email" required>
        <label>Parolă</label>
        <input type="password" id="login-password" required>
        <button type="submit" class="btn" style="width:100%;">Intră</button>
      </form>
      <p class="text-sm" style="margin-top:1rem;">
        Recomandăm activarea <strong>2FA (TOTP)</strong> din setările contului Supabase Auth.
      </p>
      <div id="login-error" class="alert alert-danger" style="display:none;"></div>
    </div>
  </div>

  <!-- Aplicația principală -->
  <div id="app" style="display:flex; width:100%;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <h2>PFA Dashboard</h2>
      <ul id="nav-menu">
        <li><a href="#" data-tab="dashboard" class="active">Dashboard</a></li>
        <li><a href="#" data-tab="facturi">Facturi emise</a></li>
        <li><a href="#" data-tab="cheltuieli">Cheltuieli</a></li>
        <li><a href="#" data-tab="registru">Registru fiscal</a></li>
        <li><a href="#" data-tab="extrase">Extrase de cont</a></li>
        <li><a href="#" data-tab="contracte">Contracte</a></li>
        <li><a href="#" data-tab="declaratie">Declarația unică</a></li>
        <li><a href="#" data-tab="documente">Arhivă documente</a></li>
        <li><a href="#" data-tab="secretariat">Secretariat</a></li>
        <li><a href="#" data-tab="efactura">e-Factura</a></li>
      </ul>
      <div style="margin-top:auto;">
        <button id="btn-backup" class="btn btn-secondary" style="width:100%;">Backup JSON</button>
        <button id="btn-restore" class="btn btn-secondary" style="width:100%; margin-top:0.5rem;">Restore JSON</button>
      </div>
    </aside>

    <!-- Conținut principal -->
    <main class="main">
      <div class="topbar">
        <button class="hamburger" id="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div class="user-info">
          <span id="user-email" class="user-email"></span>
          <span id="last-sync" class="last-sync"></span>
        </div>
        <button id="btn-logout" class="btn btn-secondary">Logout</button>
      </div>

      <!-- Taburi -->
      <div id="tab-dashboard" class="tab-content active"></div>
      <div id="tab-facturi" class="tab-content"></div>
      <div id="tab-cheltuieli" class="tab-content"></div>
      <div id="tab-registru" class="tab-content"></div>
      <div id="tab-extrase" class="tab-content"></div>
      <div id="tab-contracte" class="tab-content"></div>
      <div id="tab-declaratie" class="tab-content"></div>
      <div id="tab-documente" class="tab-content"></div>
      <div id="tab-secretariat" class="tab-content"></div>
      <div id="tab-efactura" class="tab-content"></div>
    </main>
  </div>

  <!-- Scripturi CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <!-- Module aplicație -->
  <script src="js/config-fiscal.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/e-factura.js"></script>
  <script src="js/facturi.js"></script>
  <script src="js/cheltuieli.js"></script>
  <script src="js/registru.js"></script>
  <script src="js/extrase.js"></script>
  <script src="js/contracte.js"></script>
  <script src="js/declaratie.js"></script>
  <script src="js/documente.js"></script>
  <script src="js/secretariat.js"></script>
</body>
</html>
